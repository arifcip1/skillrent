<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b90014" />
      <stop offset="100%" stop-color="#40161c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dbf73" />
      <stop offset="100%" stop-color="#108e52" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Background -->
  <rect width="512" height="512" rx="130" fill="url(#bgGrad)" />

  <!-- Geometric Talent Shield + Toga Cap Symbol -->
  <g filter="url(#glow)">
    <!-- Toga Cap Top (Mahasiswa Talent Symbol) -->
    <polygon points="256,90 390,150 256,210 122,150" fill="#ffffff" />
    <path d="M 160 170 L 160 230 C 160 270, 352 270, 352 230 L 352 170" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Stylized 'S' for SkillRent -->
    <path d="M 330 260 C 310 240, 220 220, 220 190 C 220 170, 240 160, 260 160 C 290 160, 310 175, 320 195 L 370 170 C 350 130, 310 110, 260 110 C 190 110, 160 155, 160 200 C 160 275, 310 280, 310 320 C 310 345, 280 360, 250 360 C 210 360, 185 335, 175 310 L 125 335 C 145 385, 190 415, 250 415 C 330 415, 370 370, 370 315 C 370 255, 330 260, 330 260 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Green Escrow Verification Badge -->
  <circle cx="390" cy="390" r="75" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="14" />
  <path d="M 355 390 L 380 415 L 425 365" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
